<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>简历一键填充助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">简</div>
    <div><strong>求职资料库</strong><small id="panel-version">仅保存在此设备</small></div>
    <button id="fill-page" class="primary fill-button" type="button">填写当前网页</button>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <!-- 多份简历：不同岗位一份，投递时切换（数量不设上限） -->
  <section class="library-bar" aria-label="简历管理">
    <div class="library-row">
      <select id="resume-select" aria-label="切换简历"></select>
      <input id="resume-name" type="text" aria-label="简历名称" placeholder="简历名称">
    </div>
    <div class="library-row library-actions">
      <button id="resume-new" class="link-button" type="button">＋ 新建</button>
      <button id="resume-copy" class="link-button" type="button">复制</button>
      <button id="resume-delete" class="link-button" type="button">删除</button>
      <button id="resume-import" class="link-button" type="button">导入 JSON</button>
      <button id="resume-export" class="link-button" type="button">导出 JSON</button>
      <button id="resume-sample" class="link-button" type="button">示例简历</button>
      <input id="resume-import-file" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="progress" class="progress" aria-live="polite">
      <div class="progress-text"></div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
  </section>

  <section id="report" class="report" hidden aria-label="填充报告">
    <div class="report-head">
      <strong>填充报告</strong>
      <div class="report-actions">
        <button id="report-copy" class="link-button" type="button">复制诊断</button>
        <button id="report-close" class="link-button" type="button">收起</button>
      </div>
    </div>
    <div id="report-summary" class="report-summary"></div>
    <div id="report-body" class="report-body"></div>
  </section>

  <div class="layout">
    <nav class="category-nav" aria-label="资料分类">
      <div id="category-nav"></div>
      <button id="apps-nav" class="nav-item apps-nav" type="button"><span>投递记录</span><span class="nav-count" id="apps-count"></span></button>
    </nav>
    <main class="main-panel">
      <div class="section-heading">
        <div><p class="eyebrow">我的资料</p><h1 id="section-title">个人信息</h1></div>
        <button id="add-record" class="secondary" type="button">＋ 添加记录</button>
      </div>
      <p id="section-description" class="section-description"></p>
      <div id="records" class="records"></div>
      <div id="empty-state" class="empty-state" hidden>还没有填写内容。所有字段均为选填。</div>
      <div id="apps-view" class="apps-view" hidden></div>
    </main>
  </div>
  <footer>填写前请检查资料；助手不会替你提交网申。</footer>
  <script src="panel.bundle.js"></script>
</body>
</html>
